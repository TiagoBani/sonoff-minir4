[platformio]
default_envs = minir4-readout
src_dir = main

[env:minir4-readout]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
build_flags =
    -Wall
    -Wextra
    -Werror=return-type
